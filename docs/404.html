/* Candor design system fonts — latin subset only
 * @font-face declarations for self-hosted font files copied to /fonts/
 * Source packages: @fontsource-variable/* (the families candor-fonts.css loads in Candor 7.0.0)
 *
 * Note: this file is inlined into a <style> tag in base.njk via Nunjucks include,
 * so url() targets must be path-prefix-aware. The `| url` filter handles that.
 */

/* Roboto Flex Variable — UI text, headings (--typeface-sans)
 * The opsz file carries the optical-size axis as well as weight, so
 * font-optical-sizing: auto gives headings their intended stroke contrast. */
@font-face {
  font-family: 'Roboto Flex Variable';
  font-style: normal;
  font-display: swap;
  font-weight: 100 1000;
  src: url('/blog-public/fonts/roboto-flex-latin-opsz-normal.woff2') format('woff2-variations');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

 * candor-blog.css targets .post-card:first-child, which matches every <article>
 * since each is the sole child of its <li>. Override to restore correct behavior. */
.post-list > li .post-card {
	padding-top: var(--spacing-lg);
	border-top: var(--border-width-thin) solid var(--color-border-default);
}
@media (min-width: 640px) {
	.post-list > li .post-card {
		padding-top: var(--spacing-xl);
	}
}
.post-list > li:first-child .post-card {
	border-top: none;
	padding-top: 0;
}

/* Post-card hero image — soften bottom edge so image flows into card body.
 * mask-image adapts to both light and dark image backgrounds.
 * Note: postslist.njk uses <img class="post-card__image"> directly (not eleventy-img <picture>),
 * so the picture img rules below are reserved for future use if that changes. */
img.post-card__image {
	-webkit-mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
	mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
}

/* Reserved: eleventy-img <picture> output in post-card image slots */
.post-card__image-link picture {
	display: block;
	width: 100%;
}
.post-card__image-link picture img {
	display: block;
	width: 100%;
	aspect-ratio: 16/7;
	object-fit: cover;
	border-radius: var(--radius-md);
	transition: transform 200ms ease;
}
.post-card--featured .post-card__image-link picture img {
	aspect-ratio: 16/9;
}
@media (min-width: 640px) {
	.post-card--featured .post-card__image-link picture img {
		aspect-ratio: 4/3;
	}
}
.post-list--grid .post-card .post-card__image-link picture img {
	aspect-ratio: 3/2;
	border-radius: 0;
}
.post-card__image-link:hover picture img,
.post-card__image-link:focus-visible picture img {
	transform: scale(1.01);
}

/* Executive Summary — prefatory block, 14px body, overline label heading */
.article .exec-summary h2 {
	font-family: var(--font-family-accessible);
	font-size: var(--font-size-sm);
	font-weight: var(--font-weight-bold);
	text-transform: uppercase;
	letter-spacing: var(--letter-spacing-wide);
	color: var(--color-text-subtle);
	margin-top: 0;
	margin-bottom: var(--spacing-sm);
}
.article .exec-summary p,
.article .exec-summary li {
	font-size: var(--font-size-sm);
	letter-spacing: 0.03em;
}

/* Post notice — update, disclaimer or policy date above the body. House style in CLAUDE.md */
.article .post-notice {
	margin-block: var(--spacing-md) var(--spacing-xl);
}
.article .post-notice p {
	font-family: var(--font-family-accessible);
	font-size: var(--font-size-sm);
	letter-spacing: 0.03em;
	color: var(--color-text-subtle);
}

/* Screenshot figure — bordered container for before/after screenshot pairs in articles */
.screenshot-figure {
	margin: var(--spacing-xl) 0;
	padding: 0;
	border: var(--border-width-thin) solid var(--color-border-default);
	border-radius: var(--radius-md);
	overflow: hidden;
}
.article .screenshot-figure figcaption {
	margin: 0;
	font-family: var(--font-family-base);
	font-size: var(--font-size-sm);
	font-style: normal;
	line-height: var(--line-height-normal);
	color: var(--color-text-subtle-on-surface);
	background: var(--color-bg-surface);
	padding: var(--spacing-sm);
	border-top: var(--border-width-thin) solid var(--color-border-default);
}
.article .screenshot-figure figcaption strong {
	font-weight: var(--font-weight-semibold);
}
.screenshot-figure p {
	margin: 0;
	line-height: 0;
}
.screenshot-figure picture,
.screenshot-figure img {
	display: block;
	width: 100%;
}

/* Swatch comparison table — colour samples with their measured figures as real text.
 * Swatch colours are set inline per cell; everything around them uses blog tokens. */
.swatch-table {
	margin: var(--spacing-xl) 0;
}
.swatch-table table {
	width: 100%;
	border-collapse: collapse;
	table-layout: fixed;
}
.article .swatch-table caption {
	caption-side: bottom;
	text-align: left;
	font-size: var(--font-size-sm);
	line-height: var(--line-height-normal);
	color: var(--color-text-subtle-on-surface);
	background: var(--color-bg-surface);
	padding: var(--spacing-sm);
	border-radius: 0 0 var(--radius-md) var(--radius-md);
}
.article .swatch-table th,
.article .swatch-table td {
	padding: var(--spacing-xs);
	vertical-align: top;
	text-align: left;
	font-size: var(--font-size-sm);
	line-height: var(--line-height-normal);
}
.swatch-table thead th {
	font-weight: var(--font-weight-semibold);
}
.swatch-table thead td:first-child {
	width: 22%;
}
.swatch-table tbody th {
	font-weight: var(--font-weight-semibold);
}
.swatch-table tbody th span {
	display: block;
	font-weight: normal;
	color: var(--color-text-subtle);
}
.swatch-table__sample {
	display: block;
	padding: var(--spacing-md) var(--spacing-sm);
	margin-bottom: var(--spacing-xs);
	border-radius: var(--radius-md);
	font-size: var(--font-size-md);
	font-weight: var(--font-weight-semibold);
}
.swatch-table__fig {
	display: block;
	white-space: nowrap;
}
@media (max-width: 30rem) {
	.article .swatch-table th,
	.article .swatch-table td {
		padding: var(--spacing-xs) 2px;
	}
	.swatch-table thead td:first-child {
		width: 19%;
	}
	.swatch-table__sample {
		padding: var(--spacing-sm) var(--spacing-xs);
		text-align: center;
	}
}

/* Lightness chart — inline SVG; mark fills are data (literal colours), all ink is tokens */
.lightness-chart {
	margin: var(--spacing-xl) 0;
}
.lightness-chart svg {
	display: block;
	width: 100%;
	max-width: 22rem;
	height: auto;
	margin: 0 auto var(--spacing-sm);
}
.lightness-chart .t {
	fill: var(--color-text-default);
	font-family: var(--font-family-base);
	font-size: 16px; /* user units: drawn 300 wide, so >= 14px rendered at a 320px viewport */
}
.lightness-chart .h {
	font-weight: var(--font-weight-semibold);
}
.lightness-chart .s {
	fill: var(--color-text-subtle);
}
/* Axes carry the scale, so they take the 1.4.11 border token; border-strong is
 * decorative (OKCA 1.3 on the light page). */
.lightness-chart .ax {
	stroke: var(--color-border-control);
	stroke-width: 1;
}
.lightness-chart .cn {
	stroke: var(--color-text-subtle);
	stroke-width: 1.5;
}
.lightness-chart .m > :not(title) {
	stroke: var(--color-text-default);
	stroke-width: 1.25;
}
.article .lightness-chart figcaption {
	font-style: normal;
	font-size: var(--font-size-sm);
	line-height: var(--line-height-normal);
	color: var(--color-text-subtle-on-surface);
	background: var(--color-bg-surface);
	padding: var(--spacing-sm);
	border-radius: var(--radius-md);
}
.chart-legend {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: var(--spacing-xs) var(--spacing-md);
	margin: 0 0 var(--spacing-sm);
	padding: 0;
	list-style: none;
	font-size: var(--font-size-sm);
	color: var(--color-text-default);
}
.article .chart-legend li {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	margin: 0;
}
.chart-legend svg {
	width: auto;
	height: 16px;
	margin: 0;
	flex: none;
}
.chart-legend svg > .pt,
.chart-legend svg > :not(.ln):not(.hand) {
	fill: var(--color-bg-surface);
	stroke: var(--color-text-default);
	stroke-width: 1.25;
}
.lightness-chart details {
	margin-top: var(--spacing-sm);
	font-size: var(--font-size-sm);
}

/* Chroma chart — extends .lightness-chart; curves told apart by line style, not colour */
.chroma-chart svg {
	max-width: 30rem;
}
.chroma-chart .ln {
	fill: none;
	stroke: var(--color-text-default);
	stroke-width: 2;
}
.chroma-chart .dash {
	stroke-dasharray: 6 4;
}
.chroma-chart .hand,
.chroma-chart .m > .hand {
	fill: none;
	stroke: var(--color-text-subtle);
	stroke-width: 1.5;
}

/* Code-block comparison — each panel sets its own --cc-* colours inline.
 * Prose and code are reading text, so both stay at 16px (Candor: Tier 1 >= 16px). */
.code-compare {
	margin: var(--spacing-xl) 0;
}
.code-compare__pair {
	display: grid;
	grid-template-columns: 1fr;
	gap: var(--spacing-sm);
}
@media (min-width: 40rem) {
	.code-compare__pair {
		grid-template-columns: 1fr 1fr;
	}
}
.code-compare__panel {
	min-width: 0;
	background: var(--cc-page);
	color: var(--cc-text);
	border: 1px solid var(--color-border-default);
	border-radius: var(--radius-md);
	padding: var(--spacing-sm);
}
.article .code-compare__label {
	margin: 0;
	font-size: var(--font-size-sm);
	font-weight: var(--font-weight-semibold);
}
.article .code-compare__prose {
	margin: var(--spacing-xs) 0;
	font-size: var(--font-size-md);
	color: var(--cc-text);
}
.article .code-compare__code {
	margin: 0;
	padding: var(--spacing-sm) var(--spacing-xs);
	border: 0;
	border-radius: var(--radius-sm);
	background: var(--cc-code);
	color: var(--cc-code-text);
	font-size: var(--font-size-md);
	line-height: 1.5;
	overflow-x: auto;
}
.article .code-compare__code code {
	background: none;
	color: inherit;
	padding: 0;
	font-size: inherit;
	word-break: normal;
	white-space: pre;
}
.article .code-compare figcaption {
	font-style: normal;
	font-size: var(--font-size-sm);
	line-height: var(--line-height-normal);
	color: var(--color-text-subtle-on-surface);
	background: var(--color-bg-surface);
	padding: var(--spacing-sm);
	border-radius: var(--radius-md);
	margin-top: var(--spacing-sm);
	text-align: left;
}

/* Code inside captions, data tables and figure panels: Candor's rule, never below 14px */
.article figcaption code,
.article caption code,
.article figure table code {
	font-size: max(0.9em, var(--font-size-sm));
}

/* A wide table scrolls inside its own region instead of widening the page */
.table-scroll {
	overflow-x: auto;
}
.table-scroll:focus-visible {
	outline: 2px solid var(--color-ring-focus);
	outline-offset: 2px;
}

/* Painting figure — image with an outline layer marking sampled patches.
 * Chips carry their own opaque background so their contrast never depends on the image. */
.painting-figure {
	margin: var(--spacing-xl) 0;
}
.painting-figure__frame {
	position: relative;
	line-height: 0;
}
.painting-figure__frame picture,
.painting-figure__frame img {
	display: block;
	width: 100%;
	height: auto;
}
.painting-figure__frame svg {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
}
.painting-figure__frame rect {
	fill: none;
	vector-effect: non-scaling-stroke;
}
.painting-figure__frame .halo {
	stroke: oklch(1 0 0);
	stroke-width: 4;
}
.painting-figure__frame .line {
	stroke: oklch(0.2 0 0);
	stroke-width: 2;
}
.painting-figure__chip {
	position: absolute;
	padding: 2px 6px;
	border-radius: var(--radius-sm);
	background: oklch(0.2 0 0);
	color: oklch(1 0 0);
	font-family: var(--font-family-base);
	font-size: var(--font-size-sm);
	line-height: 1.4;
	white-space: nowrap;
}
.article .painting-figure figcaption {
	font-style: normal;
	font-size: var(--font-size-sm);
	line-height: var(--line-height-normal);
	color: var(--color-text-subtle-on-surface);
	background: var(--color-bg-surface);
	padding: var(--spacing-sm);
	border-radius: 0 0 var(--radius-md) var(--radius-md);
}

/* KaTeX display equations — allow horizontal scroll on narrow viewports
 * so long equations don't force the page wider than the column. */
.article .katex-display {
	overflow-x: auto;
	overflow-y: hidden;
	padding: 0.25em 0;
}
.article .katex-display:focus-visible {
	outline: var(--focus-ring-width) solid var(--color-ring-focus);
	outline-offset: 2px;
}
/* KaTeX sets sub- and superscripts at 0.7 of .katex. Its default 1.21em puts them
 * at 13.6px on 16px body text; 1.3em lifts them to 14.6px, over the 14px floor. */
.article .katex {
	font-size: 1.3em;
}

/* Footnotes — markdown-it-footnote default markup, scoped to article context.
 * The browser's sup shrink plus 0.85em rendered markers at 11.3px; pin the sup to
 * the 14px floor and keep line-height 0 so it does not open up the line. */
.article .footnote-ref {
	font-size: var(--font-size-sm);
	line-height: 0;
}
.article .footnote-ref a,
.article .footnote-ref a:visited {
	font-size: 1em;
	border-bottom: none;
	padding: 0 0.1em;
}
.article .footnotes {
	margin-top: var(--spacing-2xl);
	font-size: var(--font-size-sm);
	color: var(--color-text-subtle);
}
.article .footnotes-sep {
	border: none;
	border-top: var(--border-width-thin) solid var(--color-border-default);
	margin: var(--spacing-2xl) 0 var(--spacing-md);
}
.article .footnotes-list {
	padding-left: 1.5rem;
}
.article .footnote-item p {
	margin: 0 0 var(--spacing-xs);
	line-height: var(--line-height-normal);
}
.article .footnote-backref {
	margin-left: 0.25em;
	text-decoration: none;
	border-bottom: none;
}

/* Hero image — soften edges so the image flows into the page rather than jarring against it.
 * :has(picture) guards against applying image styles to text-only first paragraphs.
 * mask-image fade adapts to both light and dark backgrounds. */
.article > p:first-child:has(picture) {

.article > p:first-child:has(picture) img {

	border-radius: var(--radius-md);
	-webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
	mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}
